<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ski · CCC</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ccc-theme')||'dark'}catch(_){}</script>
<script src="/static/app-rail.js" defer></script>
<script>
// The app's id is its folder name, so the page works under any name.
window.APP_ID=(location.pathname.match(/^\/view\/([a-z0-9_-]+)/)||[])[1]||'ski';
// data-ready="event": this page says itself when its table is drawn (see ready() below).
(function(){var s=document.createElement('script');s.src='/static/app-kit.js';s.dataset.app=window.APP_ID;s.dataset.ready='event';document.head.appendChild(s)})();
</script>
<style id="skicss">
:root{--bg:#0f1115;--panel:#161a21;--line:#262c36;--text:#edf0f5;--muted:#98a3b3;--accent:#80b9ff;--good:#62c98f;--warn:#f0b860;--bad:#ff8f8f;--snow:128,185,255;--hover:rgba(255,255,255,.035)}
[data-theme="light"]{--bg:#fbfbfc;--panel:#fff;--line:#e4e7ec;--text:#1a1f29;--muted:#667085;--accent:#1f6fd0;--good:#1c8a50;--warn:#a26200;--bad:#c62828;--snow:31,111,208;--hover:rgba(16,24,40,.035)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#dash{padding:28px 32px 72px;max-width:1180px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.muted{color:var(--muted)}
h1{font-size:24px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:13px;font-weight:600;margin:0}
/* header: title on the left, the week's snow on the right */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 32px;flex-wrap:wrap;margin-bottom:28px}
.top>div:first-child{flex:1 1 300px;min-width:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.strip{display:flex;gap:4px}
.strip .d{width:50px;text-align:center;font-variant-numeric:tabular-nums}
.strip .w{display:block;font-size:11px;color:var(--muted)}
.strip .w.black{color:var(--bad)}
.strip b{display:block;margin:3px 0;padding:5px 0;border-radius:7px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.strip .t{display:block;font-size:11px;color:var(--muted)}
.stripname{font-size:11px;color:var(--muted);margin:6px 0 2px;text-align:right}
/* buttons */
button{font:inherit}
.btn{font-size:12.5px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line);color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--bg)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.link:hover{text-decoration:underline}
/* still to book: one line until it is opened */
.need{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;background:var(--panel);margin-bottom:28px}
.need>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;font-weight:600;border-radius:10px;min-height:44px}
.need>summary::-webkit-details-marker{display:none}
.need>summary .n::before{content:"›";display:inline-block;width:16px;color:var(--muted);transition:transform .15s}
.need[open]>summary .n::before{transform:rotate(90deg)}
.need>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.need>#need{padding:0 14px 6px 30px}
.need table td{padding:8px 10px 8px 0;vertical-align:top}
/* tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:0;padding-bottom:8px}
tr:last-child>td{border-bottom:0}
.c{text-align:center}
.soon{color:var(--bad);font-weight:600}
.ok{color:var(--good)}
/* the weekends table */
.mainhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.mainhead h2{font-size:15px}
tr.trip{cursor:pointer}
tr.trip:hover>td{background:var(--hover)}
tr.trip.open>td{border-bottom-color:transparent}
tr.trip.hid{opacity:.45}
td.when b{font-weight:600}
td.when .s{display:block;font-size:12.5px;color:var(--muted);max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:rgba(var(--snow),.16);color:var(--accent);vertical-align:1px}
td.in{color:var(--muted);white-space:nowrap}
td.bk{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;transition:transform .15s}
tr.open .chev{transform:rotate(90deg)}
.chev:focus-visible,.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.more>td{padding:2px 10px 18px;background:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;max-width:860px}
.form label{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.form .row{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
textarea.note{width:100%;font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);resize:vertical}
textarea.note:focus,select.nights:focus{outline:none;border-color:var(--accent)}
select.nights{font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
/* on/off switch */
.tog{position:relative;display:inline-block;width:34px;height:20px;vertical-align:middle}
.tog input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;width:100%;height:100%}
.tog span{position:absolute;inset:0;border-radius:20px;background:var(--line);transition:background .15s;pointer-events:none}
.tog span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.tog input:checked+span{background:var(--good)}
.tog input:checked+span::after{transform:translateX(14px)}
.tog input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* everything else, folded away */
.folds{margin-top:36px;border-top:1px solid var(--line)}
.fold{border-bottom:1px solid var(--line)}
.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;cursor:pointer;font-weight:600;border-radius:6px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .n::before{content:"›";display:inline-block;width:16px;color:var(--muted);transition:transform .15s}
.fold[open]>summary .n::before{transform:rotate(90deg)}
.fold>summary:hover .n{color:var(--accent)}
.fold>summary .hint{font-weight:400;font-size:13px;color:var(--muted)}
.fold>.body{padding:4px 2px 22px 18px}
.fold.wk{border-bottom:0;border-top:1px solid var(--line)}
.fold.wk:first-child{border-top:0}
.fold.wk>summary{font-weight:500;padding:10px 2px}
.cat{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
ul.dates{list-style:none;margin:0;padding:0;max-width:520px}
ul.dates li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
ul.dates li:last-child{border-bottom:0}
ul.dates li.past{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
@media(max-width:760px){#dash{padding:18px 14px 60px}.form{grid-template-columns:1fr}.strip .d{width:40px}}
</style></head>
<body>
<main id="dash" data-ccc-content>
  <header class="top">
    <div><h1>⛷ Ski</h1><div class="sub" id="sub">&nbsp;</div></div>
    <div id="snow"></div>
  </header>
  <details class="need" id="needbox" hidden>
    <summary><span class="n" id="needtitle"></span></summary>
    <div id="need"></div>
  </details>
  <section>
    <div class="mainhead"><h2>Weekends</h2><span id="tripsfoot" class="muted"></span></div>
    <div id="trips" class="muted">Loading…</div>
  </section>
  <div class="folds">
    <details class="fold" id="f-prices"><summary><span class="n">Prices by weekend</span><span class="hint" id="h-prices"></span></summary><div class="body" id="prices"></div></details>
    <details class="fold" id="f-lodging"><summary><span class="n">Where to stay</span><span class="hint" id="h-lodging"></span></summary><div class="body" id="lodging"></div></details>
    <details class="fold" id="f-pass"><summary><span class="n">Pass blackout dates</span><span class="hint" id="h-pass"></span></summary><div class="body" id="pass"></div></details>
    <details class="fold" id="f-hotels"><summary><span class="n">Hotel bookings</span><span class="hint" id="h-hotels"></span></summary><div class="body" id="hotels"></div></details>
  </div>
  <details class="fold" id="f-routines" data-ccc-routines><summary><span class="n">Routines</span><span class="hint">Helpers that run on their own schedule</span></summary></details>
</main>
<script>
'use strict';
// ---------------------------------------------------------------------------
// How this page is put together (read this before changing it):
//  * One main thing: the Weekends table (trips()). A row is one clean line;
//    click it to open the row's details (nights, booking text, notes, hide).
//  * "Still to book" is one line above the table; it opens into the list.
//  * Extra sections live in the folds under the table, closed by default.
//    Add a new one as another <details class="fold">, and draw it inside a
//    fold('<id>', draw) call so it is only built when someone opens it.
//  * Read data with getJSON(url). It reads each file once per refresh and
//    keeps the last copy in this browser, so the page draws at once next time
//    and again when fresh data arrives. Do not call fetch() for reads.
//  * No refresh button: the page redraws by itself when a file in this folder
//    changes (ccc:app-changed, at the bottom).
// ---------------------------------------------------------------------------
const APP_ID=window.APP_ID;
const BASE='/app-static/'+APP_ID+'/';
const DATA='/api/apps/data?app='+APP_ID+'&key=';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='America/Los_Angeles';
const dayKey=d=>d.toLocaleDateString('en-CA',{timeZone:TZ});
const nice=k=>new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const add=(k,n)=>{const t=new Date(k+'T12:00:00');t.setDate(t.getDate()+n);return t.toLocaleDateString('en-CA')};
const usd=n=>n==null?'–':'$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const today=dayKey(new Date());

// ---- reading data: once per refresh, with a saved copy for an instant draw
const SNAP='ski-snap-v1:'+APP_ID;
let snap={};try{snap=JSON.parse(localStorage.getItem(SNAP)||'{}')||{}}catch(_){}
let fromSnap=false,inflight={};
const net=async u=>{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok)throw new Error(u+' '+r.status);return r.json()};
function getJSON(u){
  if(fromSnap)return u in snap?Promise.resolve(JSON.parse(JSON.stringify(snap[u]))):Promise.reject(new Error('not saved yet'));
  return inflight[u]||(inflight[u]=net(u).then(v=>{snap[u]=v;return v}));
}
const saveSnap=()=>{try{localStorage.setItem(SNAP,JSON.stringify(snap))}catch(_){}};
const optional=(u,def)=>getJSON(u).catch(()=>def);

// ---- folds: closed by default, remembered, drawn only when opened
let openFolds=[];try{openFolds=JSON.parse(localStorage.getItem('ski-folds')||'[]')}catch(_){}
function fold(id,draw){
  const d=$('f-'+id);if(!d)return;
  d.ontoggle=()=>{
    openFolds=openFolds.filter(x=>x!==id);if(d.open)openFolds.push(id);
    try{localStorage.setItem('ski-folds',JSON.stringify(openFolds))}catch(_){}
    if(d.open)draw().catch(fail(id));
  };
  // Already open (a redraw): draw now. Opening it fires the toggle above.
  if(d.open)draw().catch(fail(id));else if(openFolds.includes(id))d.open=true;
}
{const d=$('f-routines');if(d){if(openFolds.includes('routines'))d.open=true;d.ontoggle=()=>{openFolds=openFolds.filter(x=>x!=='routines');if(d.open)openFolds.push('routines');try{localStorage.setItem('ski-folds',JSON.stringify(openFolds))}catch(_){}}}}
const fail=id=>e=>{if(fromSnap)return;const el=$(id);if(el)el.innerHTML='<span class="muted">Could not load this section.</span>';console.error(id,e)};

let blackouts=[];
const isBlack=k=>blackouts.some(b=>k>=b.from&&k<=b.to);

// ---- pass: blackout dates (a fold) and the line under the title
async function pass(){
  const p=await getJSON(BASE+'pass.json');blackouts=p.blackouts||[];
  const next=blackouts.filter(b=>b.to>=today).sort((a,b)=>a.from.localeCompare(b.from))[0];
  $('h-pass').textContent=next?(next.from<=today?'blackout now, until '+nice(next.to):'next '+nice(next.from)):'none left this season';
  sub.pass=(p.name||'Pass')+(next?(next.from<=today?': blackout until '+nice(next.to):': next blackout '+nice(next.from)):'');drawSub();
  fold('pass',async()=>{
    $('pass').innerHTML=`<ul class="dates">${blackouts.map(b=>{const past=b.to<today;const days=Math.ceil((Date.parse(b.from)-Date.parse(today))/864e5);return `<li class="${past?'past':''}"><span>${nice(b.from)} to ${nice(b.to)}</span><span class="muted">${past?'':days<=0?'now':'in '+days+' days'}</span></li>`}).join('')}</ul><p class="muted">${esc(p.name||'')}${p.confirmed?'':' (to confirm)'}. From third-party listings; <a href="${esc(p.source)}" target="_blank" rel="noopener">check the pass page</a>.</p>`;
  });
}
const sub={};
function drawSub(){$('sub').textContent=[sub.resort,sub.snow,sub.pass].filter(Boolean).join('  ·  ')||' '}

// ---- snow: the weather service reports snowfall in mm over 1-6 hour
// periods and temperatures in C over half-day periods. Bucket each period
// by the Pacific calendar day of its midpoint. Kept for 30 minutes.
const mid=vt=>{const [start,dur]=vt.split('/');const m=/P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(dur||'')||[];const h=(+m[1]||0)*24+(+m[2]||0);return new Date(Date.parse(start)+h*18e5)};
async function snow(){
  const resorts=await getJSON(BASE+'resorts.json');
  const days=[...Array(7)].map((_,i)=>new Date(Date.now()+i*864e5));
  const keys=days.map(dayKey);
  sub.resort=resorts.length===1?resorts[0].name:'';drawSub();
  let saved=snap.snow;
  if(!(saved&&saved.day===today&&(fromSnap||Date.now()-saved.at<18e5))){
    if(fromSnap)return;
    const blocks=await Promise.all(resorts.map(async r=>{
      try{
        const p=(await net('https://api.weather.gov/gridpoints/'+r.grid)).properties;
        const sum={},hi={},lo={};
        for(const v of p.snowfallAmount.values){const k=dayKey(mid(v.validTime));sum[k]=(sum[k]||0)+(v.value||0)/25.4}
        const f=c=>Math.round(c*9/5+32);
        for(const v of p.maxTemperature.values)if(v.value!=null)hi[dayKey(mid(v.validTime))]=f(v.value);
        for(const v of p.minTemperature.values)if(v.value!=null)lo[dayKey(mid(v.validTime))]=f(v.value);
        return {name:r.name,sum,hi,lo};
      }catch(e){return {name:r.name,error:true}}
    }));
    if(blocks.every(b=>b.error)&&saved&&saved.day===today){/* keep the last good one */}
    else{saved=snap.snow={day:today,at:Date.now(),blocks};saveSnap()}
  }
  const blocks=saved.blocks;
  const max=Math.max(1,...blocks.flatMap(b=>b.sum?keys.map(k=>b.sum[k]||0):[]));
  const amount=v=>v==null?'–':v<0.05?'0':v.toFixed(v<10?1:0);
  $('snow').innerHTML=blocks.map(b=>b.error?`<div class="muted" style="font-size:12px">${esc(b.name)}: forecast unavailable right now</div>`:
    `${blocks.length>1?`<div class="stripname">${esc(b.name)}</div>`:''}<div class="strip" role="img" aria-label="Snow and temperature, next 7 days">${keys.map((k,i)=>{const v=k in b.sum?b.sum[k]:null;const bl=isBlack(k);
      return `<div class="d" title="${esc(nice(k))}: ${amount(v)} in of snow${b.hi[k]!=null?', high '+b.hi[k]+'°':''}${b.lo[k]!=null?', low '+b.lo[k]+'°':''}${bl?'. Pass blackout day':''}"><span class="w${bl?' black':''}">${days[i].toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'})}${bl?' ✕':''}</span><b style="background:rgba(var(--snow),${(0.55*(v||0)/max).toFixed(2)})">${amount(v)}</b><span class="t">${b.hi[k]!=null?b.hi[k]+'°':'–'}${b.lo[k]!=null?' / '+b.lo[k]+'°':''}</span></div>`}).join('')}</div>`).join('');
  const first=blocks.find(b=>!b.error);
  sub.snow=first?keys.reduce((a,k)=>a+(first.sum[k]||0),0).toFixed(1)+'″ of snow in the next 7 days':'';drawSub();
}

// ---- the main table. Each row: drive up, ski the days after check-in up to
// and including check-out, drive home.
let showAll=false;const openRows=new Set();
async function trips(){
  const el=$('trips');
  const [list,pr,ppl]=await Promise.all([getJSON(BASE+'trips.json'),optional(BASE+'prices.json',{}),optional(BASE+'people.json',[])]);
  // Who might come: one on/off column per person or group (people.json).
  let people=(Array.isArray(ppl)?ppl:[]).filter(p=>p&&p.id);
  if(!people.length)people=[{id:'me',label:'Me'}];
  // Answers live on the server (/api/apps/data, file data/<key>.json in this
  // app's folder) so every device and agent sees the same ticks. localStorage
  // is only a fallback and the one-time source: if the server has nothing for
  // a key yet, this browser's old answer is uploaded once.
  const SKEYS=['ski-hidden-trips','ski-trip-book2','ski-trip-confirmed','ski-trip-notes','ski-trip-nights'];
  const srv={};
  const post=(key,v)=>{try{fetch('/api/apps/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:APP_ID,key,value:v})}).catch(()=>{})}catch(_){}
    if(snap[DATA+key])snap[DATA+key].value=v;saveSnap()};
  await Promise.all(SKEYS.map(async k=>{try{const r=await getJSON(DATA+k);
    if(r.ok&&r.value!==null&&r.value!==undefined)srv[k]=r.value;
    else if(r.ok&&!fromSnap){const l=localStorage.getItem(k);if(l){try{post(k,JSON.parse(l))}catch(_){}}}}catch(_){}}));
  const load=(key,def)=>{if(key in srv)return JSON.parse(JSON.stringify(srv[key]));try{return JSON.parse(localStorage.getItem(key)||def)}catch(_){return JSON.parse(def)}};
  const store=(key,v)=>{try{localStorage.setItem(key,JSON.stringify(v))}catch(_){}post(key,v)};
  const HKEY='ski-hidden-trips',BKEY='ski-trip-book2',CKEY='ski-trip-confirmed',NKEY='ski-trip-notes';
  let nights=load('ski-trip-nights','{}'),hidden=load(HKEY,'[]'),book=load(BKEY,'{}'),conf=load(CKEY,'{}'),notes=load(NKEY,'{}');
  // One answer per person per trip. A trip marked booked in trips.json starts
  // as on for everyone and a click overrides it.
  const first=people[0].id;
  const old=load('ski-trip-book','{}');for(const k in old)if(!book[k])book[k]={[first]:true};
  const going=(t,w)=>book[t.id]&&w in book[t.id]?!!book[t.id][w]:!!t.booked;
  const who=t=>people.filter(p=>book[t.id]&&book[t.id][p.id]).map(p=>p.label||p.id).join(', ');

  // "Still to book": wanted by someone, not hidden, not booked yet. Shown
  // only when there is something in it.
  function need(){
    const box=$('needbox'),nel=$('need');if(!box||!nel)return;
    const cap=750;
    const todo=list.filter(t=>t.checkout>=today&&!hidden.includes(t.id)&&!t.booked&&who(t));
    box.hidden=!todo.length;
    if(!todo.length)return;
    if(!box.ontoggle){box.open=openFolds.includes('need');box.ontoggle=()=>{openFolds=openFolds.filter(x=>x!=='need');if(box.open)openFolds.push('need');try{localStorage.setItem('ski-folds',JSON.stringify(openFolds))}catch(_){}}}
    $('needtitle').textContent=todo.length===1?'1 weekend still to book':todo.length+' weekends still to book';
    nel.innerHTML='<table><tbody>'+todo.map(t=>{
      const opts=[];for(const c of (pr[t.id]&&pr[t.id].categories)||[])for(const o of c.options||[])if(o.total!=null&&!o.out)opts.push({...o,area:c.name});
      opts.sort((x,y)=>x.total-y.total);
      const ok=opts.filter(o=>o.total<=cap);
      const b=ok.find(o=>/airbnb\.com\/rooms\/\d+/.test(o.link||''))||ok[0];
      const cell=b?`<td>${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.place)}</a>`:esc(b.place)} <b>${usd(Math.round(b.total))}</b><div class="muted" style="font-size:12.5px">${esc((b.area||'').split(':')[0].split('(')[0].trim())}${b.cancel?' · '+esc(b.cancel.replace(/ \(read from the listing\)\.?/,'')):''}</div></td>`:`<td class="muted">${opts.length?'Nothing under $'+cap+'; cheapest is '+usd(Math.round(opts[0].total)):'No prices looked up yet'}</td>`;
      return `<tr><td style="white-space:nowrap"><b>${nice(t.checkin)} → ${nice(t.checkout)}</b>${t.kind==='holiday'?`<div class="muted" style="font-size:12.5px">${esc(t.label)}</div>`:''}</td><td class="muted" style="white-space:nowrap">${esc(who(t))}</td>${cell}</tr>`}).join('')+'</tbody></table>';
  }
  function draw(){
    need();
    const rows=list.filter(t=>t.checkout>=today);
    const nHidden=rows.filter(t=>hidden.includes(t.id)).length;
    const cols=5+people.length;
    el.classList.remove('muted');
    el.innerHTML=`<table><thead><tr><th>When</th><th></th><th>Pass</th>${people.map(p=>`<th class="c">${esc(p.label||p.id)}</th>`).join('')}<th>Booking</th><th></th></tr></thead><tbody>${rows.filter(t=>showAll||!hidden.includes(t.id)).map(t=>{
      // A weekend can be cut to one night: 1a = first night, ski the next
      // day; 1b = second night, ski the last day. Booked rows keep their dates.
      const canCut=t.kind==='weekend'&&!t.booked;
      const pick=canCut?(nights[t.id]||'2'):'2';
      const ci=pick==='1b'?add(t.checkin,1):t.checkin,co=pick==='1a'?add(t.checkin,1):t.checkout;
      const ski=[];for(let k=add(ci,1);k<=co;k=add(k,1))ski.push(k);
      const bad=ski.filter(isBlack);
      const days=Math.ceil((Date.parse(ci)-Date.parse(today))/864e5);
      const isH=hidden.includes(t.id),isOpen=openRows.has(t.id);
      const passCell=bad.length?`<span class="soon" title="Pass blackout: ${bad.map(nice).join(', ')}">✕ ${bad.length===ski.length?(ski.length>1?'all days':nice(bad[0])):bad.map(nice).join(', ')}</span>`:'<span class="ok">OK</span>';
      const details=String(conf[t.id]||t.confirmed||'').split('\n')[0];
      const bk=t.booked||details?`<span class="ok">✓</span> ${esc(details||'Booked')}`:'<span class="muted">–</span>';
      const line=[t.note,notes[t.id]&&'✎ '+String(notes[t.id]).split('\n')[0]].filter(Boolean).join('  ·  ');
      const id=esc(t.id);
      return `<tr class="trip${isH?' hid':''}${isOpen?' open':''}" data-row="${id}"><td class="when"><b>${nice(ci)} → ${nice(co)}</b>${t.kind==='holiday'?`<span class="tag">${esc(t.label)}</span>`:''}${line?`<span class="s">${esc(line)}</span>`:''}</td><td class="in">${days<=0?'now':'in '+days+' d'}</td><td>${passCell}</td>${people.map(p=>`<td class="c"><label class="tog" title="${esc(p.label||p.id)}: going?"><input type="checkbox" data-book="${id}" data-who="${esc(p.id)}"${going(t,p.id)?' checked':''} aria-label="${esc(p.label||p.id)} going, ${nice(ci)}"><span></span></label></td>`).join('')}<td class="bk">${bk}</td><td style="text-align:right"><button type="button" class="chev" data-open="${id}" aria-expanded="${isOpen}" aria-label="Details">›</button></td></tr>`+
        (isOpen?`<tr class="more${isH?' hid':''}"><td colspan="${cols}"><div class="form">
          <div><label for="c-${id}">Booking details</label>${t.confirmed?`<div class="muted" style="margin-bottom:6px;font-size:13px">${esc(t.confirmed)}</div>`:''}<textarea class="note" rows="2" id="c-${id}" data-conf="${id}" placeholder="Hotel, confirmation #, price, pay at booking or property, free-cancel date…">${esc(conf[t.id]||'')}</textarea></div>
          <div><label for="n-${id}">Notes</label><textarea class="note" rows="2" id="n-${id}" data-note="${id}" placeholder="Add a note…">${esc(notes[t.id]||'')}</textarea></div>
          <div class="row">${canCut?`<select class="nights" data-nights="${id}" aria-label="Nights"><option value="2"${pick==='2'?' selected':''}>2 nights</option><option value="1a"${pick==='1a'?' selected':''}>1 night, ski the first day</option><option value="1b"${pick==='1b'?' selected':''}>1 night, ski the second day</option></select>`:''}<button type="button" class="btn" data-hide="${id}">${isH?'Show this weekend again':'Hide this weekend'}</button></div>
        </div></td></tr>`:'');}).join('')}</tbody></table>`;
    $('tripsfoot').innerHTML=nHidden?`<button type="button" class="link" id="togglehidden">${showAll?'Hide the '+nHidden+' hidden again':'Show '+nHidden+' hidden'}</button>`:'';
    el.querySelectorAll('tr.trip').forEach(r=>r.onclick=e=>{if(e.target.closest('label,input,a,select,textarea,button:not(.chev)'))return;const id=r.dataset.row;if(openRows.has(id))openRows.delete(id);else openRows.add(id);draw()});
    el.querySelectorAll('select[data-nights]').forEach(x=>x.onchange=()=>{if(x.value==='2')delete nights[x.dataset.nights];else nights[x.dataset.nights]=x.value;store('ski-trip-nights',nights);draw()});
    el.querySelectorAll('button[data-hide]').forEach(b=>b.onclick=()=>{const id=b.dataset.hide;hidden=hidden.includes(id)?hidden.filter(x=>x!==id):hidden.concat(id);if(hidden.includes(id))openRows.delete(id);store(HKEY,hidden);draw()});
    el.querySelectorAll('input[data-book]').forEach(x=>x.onchange=()=>{(book[x.dataset.book]=book[x.dataset.book]||{})[x.dataset.who]=x.checked;store(BKEY,book);draw()});
    el.querySelectorAll('textarea[data-conf]').forEach(x=>x.oninput=()=>{if(x.value.trim())conf[x.dataset.conf]=x.value;else delete conf[x.dataset.conf];store(CKEY,conf)});
    el.querySelectorAll('textarea[data-note]').forEach(x=>x.oninput=()=>{if(x.value.trim())notes[x.dataset.note]=x.value;else delete notes[x.dataset.note];store(NKEY,notes)});
    const th=$('togglehidden');if(th)th.onclick=()=>{showAll=!showAll;draw()};
  }
  draw();

  // ---- fold: real quotes per weekend, grouped by category. One weekend is
  // one line until it is opened.
  const priced=Object.keys(pr).sort().filter(id=>!hidden.includes(id)&&(list.find(x=>x.id===id)||{checkout:id}).checkout>=today);
  $('h-prices').textContent=priced.length?priced.length+(priced.length===1?' weekend':' weekends')+' looked up':'none looked up yet';
  fold('prices',async()=>{
    const el=$('prices');
    if(!priced.length){el.innerHTML='<span class="muted">Ask the agent to search a weekend and the quotes show up here.</span>';return}
    el.innerHTML=priced.map(id=>{
      const w=pr[id],t=list.find(x=>x.id===id)||{checkin:id,checkout:id};
      const totals=(w.categories||[]).flatMap(c=>(c.options||[]).filter(o=>o.total!=null&&!o.out).map(o=>o.total));
      return `<details class="fold wk" data-wk="${esc(id)}"><summary><span class="n">${nice(t.checkin)} → ${nice(t.checkout)}</span><span class="hint">${totals.length?totals.length+' options from '+usd(Math.round(Math.min(...totals))):'no prices yet'}</span></summary><div class="body"></div></details>`}).join('');
    el.querySelectorAll('details[data-wk]').forEach(d=>d.ontoggle=()=>{
      const body=d.querySelector('.body');if(!d.open||body.childElementCount)return;
      const w=pr[d.dataset.wk];
      const place=o=>`${o.link&&!o.out?`<a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.place)}</a>`:esc(o.place)}${o.pets?`<div class="muted">🐾 ${esc(o.pets)}</div>`:''}${o.prox?`<div class="muted">📍 ${esc(o.prox)}</div>`:''}`;
      body.innerHTML=`<p class="muted" style="margin:0 0 4px">${esc(w.guests)}. Checked ${esc(w.checked)}; rates change, so re-check before booking.${w.rules?'<br><b>'+esc(w.rules)+'</b>':''}</p>`+(w.categories||[]).map(c=>`<div class="cat">${esc(c.name)}</div><table><thead><tr><th>Place</th><th>Room</th><th>Nightly</th><th>Total</th><th>Pay and cancel</th></tr></thead><tbody>${[...c.options.filter(o=>!o.out),...c.options.filter(o=>o.out)].map(o=>o.out?`<tr style="opacity:.5"><td>${place(o)}${o.room?`<div class="muted">${esc(o.room)}</div>`:''}</td><td colspan="4" class="muted">Ruled out: ${esc(o.out)}</td></tr>`:o.total==null?`<tr><td>${place(o)}</td><td colspan="4" class="muted">${esc(o.status)}</td></tr>`:`<tr><td>${place(o)}</td><td>${esc(o.room)}</td><td>${(o.nightly||[]).map(usd).join(', ')}</td><td><b>${usd(o.total)}</b></td><td>${esc(o.pay)}<div class="muted">${esc(o.cancel)}</div><div class="muted">${esc(o.note||'')}</div></td></tr>`).join('')}</tbody></table>`).join('');
    });
  });
}

// ---- fold: which hotels, condos and rentals are worth considering. Filter
// by area or points program; prices are looked up per trip.
let lodgingArea='All';
async function lodging(){
  const d=await getJSON(BASE+'lodging.json');
  $('h-lodging').textContent=d.places.length+' places';
  const draw=async()=>{
    const el=$('lodging');
    const areas=['All',...new Set(d.places.map(p=>p.area.replace(/ \(.*/,'')))];
    const progs=[...new Set(d.places.map(p=>p.program).filter(Boolean))];
    const filters=[...areas,...progs.map(p=>p+' points')];
    const show=p=>lodgingArea==='All'||(lodgingArea.endsWith(' points')?p.program===lodgingArea.replace(' points',''):p.area.startsWith(lodgingArea));
    el.innerHTML=`<div class="chips">${filters.map(f=>`<button type="button" class="btn" data-f="${esc(f)}" aria-pressed="${f===lodgingArea}">${esc(f)}</button>`).join('')}</div>
    <table><thead><tr><th>Place</th><th>Type</th><th>Area</th><th>Getting to the lift</th><th>Points</th><th>Pay and cancel</th><th>Note</th></tr></thead><tbody>${d.places.filter(show).map(p=>`<tr><td>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.name)}</a>`:esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(p.area)}</td><td>${esc(p.lift)}</td><td>${esc(p.program||'–')}</td><td class="${p.pay==='To check'?'muted':''}">${esc(p.pay)}</td><td class="muted">${esc(p.note)}</td></tr>`).join('')}</tbody></table>
    <p class="muted">${(d.notes||[]).map(esc).join(' ')} Checked ${esc(d.checked)}.</p>`;
    el.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{lodgingArea=b.dataset.f;draw()});
  };
  fold('lodging',draw);
}

// ---- fold: bookings on record, soonest free-cancel deadline first
async function hotels(){
  const list=(await getJSON(BASE+'bookings.json')).slice().sort((a,b)=>String(a.free_cancel_until).localeCompare(String(b.free_cancel_until)));
  const left=b=>Math.ceil((Date.parse(b.free_cancel_until)-Date.now())/864e5);
  const next=list.find(b=>left(b)>=0);
  $('h-hotels').innerHTML=!list.length?'none yet':list.length+(list.length===1?' booking':' bookings')+(next?` · <span class="${left(next)<=3?'soon':''}">free cancel ends in ${left(next)} d</span>`:'');
  fold('hotels',async()=>{
    $('hotels').innerHTML=!list.length?'<span class="muted">No bookings yet. Tell the agent when you book one and it will remind you before free cancellation ends.</span>':
      `<table><thead><tr><th>Hotel</th><th>Stay</th><th>Free cancel until</th><th>Days left</th></tr></thead><tbody>${list.map(b=>`<tr><td>${esc(b.hotel)}</td><td>${esc(b.checkin)} → ${esc(b.checkout)}</td><td>${esc(b.free_cancel_until)}</td><td class="${left(b)<=3?'soon':''}">${left(b)<0?'passed':left(b)}</td></tr>`).join('')}</tbody></table>`;
  });
}

// ---- drawing: first from the copy saved in this browser (instant), then
// from the server. ready() tells CCC the table is on screen (load time).
function ready(cached){
  if(window.cccAppContentReady)return;
  window.cccAppContentReady={ms:performance.now(),cached:!!cached};
  window.dispatchEvent(new CustomEvent('ccc:app-ready',{detail:window.cccAppContentReady}));
}
async function drawAll(){
  await pass().catch(fail('pass'));
  const main=trips().catch(fail('trips'));
  const rest=[snow().catch(()=>{}),lodging().catch(fail('lodging')),hotels().catch(fail('hotels'))];
  await main;
  return Promise.all(rest);
}
let refreshing=null;
function refresh(){
  if(refreshing)return refreshing;
  fromSnap=false;inflight={};
  const before=JSON.stringify(snap);
  refreshing=(async()=>{
    try{
      // Never redraw under someone's typing: wait until they leave the box.
      const box=document.activeElement;
      if(box&&box.matches&&box.matches('textarea.note'))await new Promise(r=>box.addEventListener('blur',r,{once:true}));
      // Nothing to redraw when the saved copy was already current.
      const urls=Object.keys(snap).filter(u=>u!=='snow');
      if(window.__skiDrawn&&urls.length){
        await Promise.all(urls.map(u=>getJSON(u).catch(()=>{})));
        if(JSON.stringify(snap)===before){snow().catch(()=>{});return}
      }
      await drawAll();window.__skiDrawn=true;
    }finally{saveSnap();refreshing=null;ready(false)}
  })();
  return refreshing;
}
(async()=>{
  if(!window.__skiDrawn&&snap[BASE+'trips.json']){
    fromSnap=true;
    try{await drawAll();window.__skiDrawn=true;ready(true)}catch(_){}
    fromSnap=false;
  }
  refresh();
})();

// The page redraws by itself when a file in this folder changes: new data is
// re-read; a new version of this page is swapped in (styles, sections and
// script) without touching the agent pane or the Routines cards.
async function reloadPage(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
    if(!r.ok)throw new Error('page '+r.status);
    const doc=new DOMParser().parseFromString(await r.text(),'text/html');
    const code=[...doc.querySelectorAll('body script:not([src])')].map(x=>x.textContent).join('\n');
    const main=document.getElementById('dash'),fresh=doc.getElementById('dash');
    if(!code||!main||!fresh)throw new Error('page shape');
    // Validate the downloaded script before replacing working controls.
    const run=new Function(code);
    const css=doc.getElementById('skicss'),mine=document.getElementById('skicss');
    if(css&&mine)mine.textContent=css.textContent;
    [...main.children].filter(e=>!e.hasAttribute('data-ccc-routines')).forEach(e=>e.remove());
    const rt=main.querySelector('[data-ccc-routines]');
    [...fresh.children].filter(e=>!e.hasAttribute('data-ccc-routines')).forEach(e=>main.insertBefore(document.importNode(e,true),rt));
    window.__skiDrawn=false;
    // Declarations stay local to this run, so it can happen again and again.
    run();
  }catch(e){console.error('Ski page reload failed; the current page stays open',e)}
}
window.removeEventListener('ccc:app-changed',window.__skiChanged);
window.__skiChanged=e=>{if(e.detail&&e.detail.page)reloadPage();else refresh()};
window.addEventListener('ccc:app-changed',window.__skiChanged);
